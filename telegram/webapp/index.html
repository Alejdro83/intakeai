<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>Virtualobby — Virtual Reception</title>
    
    <!-- Telegram Mini App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            document.body.classList.add('telegram-webapp');
        }
    </script>

    <header class="header" id="header">
        <div class="header-content">
            <div class="logo" id="logo">
                <span class="logo-icon">🏥</span>
                <h1>Virtualobby</h1>
            </div>
            <div class="status" id="status">
                <span class="status-dot"></span>
                <span class="status-text">Ready</span>
            </div>
        </div>
    </header>

    <main class="main">
        <!-- Scan Document -->
        <section class="step hidden" id="step-scan">
            <div class="step-header">
                <span class="step-number">1</span>
                <h2>Scan Document</h2>
            </div>
            <p class="step-description">Take a photo of your ID document</p>
            
            <!-- Camera preview (live if supported) -->
            <div class="camera-container" id="camera-container">
                <video id="camera-preview" autoplay playsinline></video>
                <canvas id="camera-canvas" class="hidden"></canvas>
                <div class="camera-overlay">
                    <div class="scan-frame"></div>
                </div>
            </div>
            
            <!-- Camera controls -->
            <div class="camera-controls" id="camera-controls">
                <button class="btn btn-secondary" id="btn-switch-camera">🔄 Switch</button>
                <button class="btn btn-primary btn-capture" id="btn-capture">📸 Capture</button>
            </div>
            
            <!-- Divider -->
            <div class="scan-divider"><span>or</span></div>
            
            <!-- File upload fallback -->
            <div class="scan-actions" id="scan-actions">
                <label class="btn btn-secondary btn-scan-main" for="file-upload-camera">📷 Take Photo</label>
                <input type="file" id="file-upload-camera" accept="image/*" capture="environment" style="display: none;">
                <label class="btn btn-secondary btn-scan-main" for="file-upload-gallery">🖼️ Gallery</label>
                <input type="file" id="file-upload-gallery" accept="image/*" style="display: none;">
            </div>
            
            <!-- Loading -->
            <div class="loading hidden" id="ocr-loading">
                <div class="spinner"></div>
                <p>Scanning document...</p>
            </div>
            
            <!-- OCR Result -->
            <div class="ocr-result hidden" id="ocr-result">
                <div class="result-header">
                    <span class="result-icon">✅</span>
                    <h3>Document Scanned</h3>
                </div>
                <div class="result-fields" id="ocr-fields"></div>
            </div>
        </section>

        <!-- Voice Interview -->
        <section class="step hidden" id="step-voice">
            <div class="step-header">
                <span class="step-number">2</span>
                <h2>Check-in Interview</h2>
            </div>
            <div class="voice-container">
                <div class="transcript" id="transcript">
                    <div class="transcript-messages" id="transcript-messages"></div>
                </div>
                <div class="voice-controls">
                    <button class="btn btn-voice" id="btn-voice">
                        <span class="voice-icon">🎤</span>
                        <span class="voice-text">Hold to speak</span>
                    </button>
                    <div class="voice-status" id="voice-status">
                        <span class="voice-wave"></span>
                        <span class="voice-label">Listening...</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Confirmation -->
        <section class="step hidden" id="step-confirm">
            <div class="step-header">
                <span class="step-number">3</span>
                <h2>Confirm Registration</h2>
            </div>
            <div class="confirm-card">
                <div class="confirm-icon">✅</div>
                <h3>Registration Complete</h3>
                <p class="confirm-message" id="confirm-message"></p>
                <div class="confirm-id" id="confirm-id"></div>
                <button class="btn btn-primary btn-block" id="btn-new-visitor">New Visitor</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>Powered by <strong>AssemblyAI</strong> Voice Agent API</p>
    </footer>

    <script>
        (function() {
            let tapCount = 0, tapTimer = null;
            const logo = document.getElementById('logo');
            if (!logo) return;
            logo.addEventListener('click', function() {
                tapCount++;
                clearTimeout(tapTimer);
                tapTimer = setTimeout(function() { tapCount = 0; }, 800);
                if (tapCount >= 3) { tapCount = 0; window.location.href = './admin.html'; }
            });
        })();
    </script>
    <script src="app.js"></script>
</body>
</html>
