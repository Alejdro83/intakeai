<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <title>Virtualobby — Virtual Reception</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
            document.body.classList.add('telegram-webapp');
        }
    </script>

    <header class="header">
        <div class="header-content">
            <div class="logo"><span class="logo-icon">🏥</span><h1 id="header-title">Welcome</h1></div>
            <div class="status"><span class="status-dot" id="status-dot"></span><span class="status-text" id="status-text">Connecting...</span></div>
        </div>
    </header>

    <main class="main">
        <!-- Step 1: Scan ID -->
        <section class="step hidden" id="step-scan">
            <div class="step-header"><span class="step-number">1</span><h2>Identity Verification</h2></div>
            <p class="step-description">First, let's verify your identity.<br>Upload a photo of your ID document.</p>
            
            <div class="scan-actions">
                <label class="btn btn-primary btn-scan-main" for="file-upload">📁 Upload File</label>
                <input type="file" id="file-upload" accept="image/*" style="display:none;">
            </div>
            
            <div class="loading hidden" id="ocr-loading"><div class="spinner"></div><p>Scanning document...</p></div>
            <div class="ocr-result hidden" id="ocr-result"><div class="result-header"><span>✅</span><h3>Document Scanned</h3></div><div class="result-fields" id="ocr-fields"></div></div>
        </section>

        <!-- Step 2: Voice Interview -->
        <section class="step hidden" id="step-voice">
            <div class="step-header"><span class="step-number">2</span><h2>Check-in Interview</h2></div>
            <div class="voice-container">
                <div class="transcript"><div class="transcript-messages" id="transcript-messages"></div></div>
                <div class="voice-controls">
                    <div class="voice-status"><span class="voice-wave"></span><span class="voice-label" id="voice-label">Listening...</span></div>
                </div>
            </div>
        </section>

        <!-- Step 3: Done -->
        <section class="step hidden" id="step-confirm">
            <div class="step-header"><span class="step-number">3</span><h2>Registration Complete</h2></div>
            <div class="confirm-card">
                <div class="confirm-icon">✅</div>
                <h3>All Done!</h3>
                <p class="confirm-message" id="confirm-message"></p>
                <div class="confirm-id" id="confirm-id"></div>
                <button class="btn btn-primary btn-block" id="btn-new-visitor">New Visitor</button>
            </div>
        </section>
    </main>

    <footer class="footer"><p>Powered by <strong>AssemblyAI</strong></p></footer>

    <script>
        (function(){let t=0,T=null,l=document.getElementById('logo');if(!l)return;l.addEventListener('click',function(){t++;clearTimeout(T);T=setTimeout(function(){t=0},800);if(t>=3){t=0;location.href='./admin.html';}});})();
    </script>
    <script src="app.js"></script>
</body>
</html>
