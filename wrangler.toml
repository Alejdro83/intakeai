name = "virtualobby-api"
main = "api/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

# Comma-separated Telegram user IDs allowed to use admin.html's write endpoints.
# Not sensitive (just numeric Telegram IDs), safe as a plain var. Keep in sync
# with the ADMIN_IDS array in telegram/webapp/admin.html.
[vars]
ADMIN_TELEGRAM_IDS = "6438086899"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "virtualobby-db"
database_id = "d3c8c0da-6133-479e-9214-ce05498061c3"

# Workers AI for vision OCR
[ai]
binding = "AI"

# R2 Bucket for document photos
[[r2_buckets]]
binding = "R2_DOCS"
bucket_name = "virtualobby-docs"

# Durable Objects for WebSocket check-in sessions
[[durable_objects.bindings]]
name = "CHECKIN_DO"
class_name = "CheckinSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CheckinSession"]
